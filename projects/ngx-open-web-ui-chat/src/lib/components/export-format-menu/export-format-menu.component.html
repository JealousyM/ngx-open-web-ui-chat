<div class="export-menu-overlay" 
     *ngIf="isOpen()" 
     (click)="onOverlayClick($event)">
  <div class="export-menu-content" 
       [style.left.px]="position().x"
       [style.top.px]="position().y"
       (click)="$event.stopPropagation()"
       role="menu"
       aria-label="Export format selection">
    
    <button class="format-option"
            [class.selected]="isSelected(0)"
            (click)="selectFormat('json')"
            type="button"
            role="menuitem">
      <span class="format-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <path d="M12 18v-6"></path>
          <path d="M9 15l3 3 3-3"></path>
        </svg>
      </span>
      <span class="format-text">{{ jsonText }}</span>
    </button>
    
    <button class="format-option"
            [class.selected]="isSelected(1)"
            (click)="selectFormat('txt')"
            type="button"
            role="menuitem">
      <span class="format-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
      </span>
      <span class="format-text">{{ txtText }}</span>
    </button>
    
    <button class="format-option"
            [class.selected]="isSelected(2)"
            (click)="selectFormat('pdf')"
            type="button"
            role="menuitem">
      <span class="format-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <path d="M10 12h4"></path>
          <path d="M10 16h4"></path>
        </svg>
      </span>
      <span class="format-text">{{ pdfText }}</span>
    </button>
  </div>
</div>
