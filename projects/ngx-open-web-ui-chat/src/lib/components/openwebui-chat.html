<div class="openwebui-chat-container">
  @if (showError()) {
    <openwebui-error-banner
      [message]="errorMessage()"
      [closeTitle]="t.close ?? 'Close'"
      (close)="hideErrorMessage()"
    />
  }
  
  @if (showRatingConfirmation()) {
    <div class="rating-confirmation">
      {{ t.ratingFeedbackThankYou ?? 'Thank you for your feedback' }}
    </div>
  }
  
  <div class="chat-messages">
    @for (msg of messages(); track $index) {
      <openwebui-chat-message
        [message]="msg"
        [enableMarkdown]="enableMarkdown"
        [isLoading]="isLoading()"
        [isLatest]="isLatestMessage(msg)"
        [showRegenerateMenu]="showRegenerateMenu() && regenerateMenuTarget() === msg"
        [showRatingForm]="showRatingForm() && ratingFormTarget()?.id === msg?.id"
        [initialRatingType]="initialRatingType"
        [translations]="t"
        (continueResponse)="continueResponse($event)"
        (toggleRegenerateMenu)="toggleRegenerateMenu($event)"
        (openRatingForm)="openRatingForm($event.message, $event.rating)"
        (customRegenerate)="regenerateWithCustomInput($event.message, $event.input)"
        (tryAgain)="regenerateTryAgain($event)"
        (moreConcise)="regenerateMoreConcise($event)"
        (addDetails)="regenerateAddDetails($event)"
        (closeRatingForm)="closeRatingForm()"
        (submitRating)="submitRatingFromEvent($event)"
      />
    }
    @if (isLoading()) {
      <div class="message assistant loading">
        <div class="message-content">
          @if (enableMarkdown) {
            <markdown [data]="currentResponse()"></markdown>
          } @else {
            {{ currentResponse() }}
          }
          <span class="cursor"></span>
        </div>
      </div>
    }
  </div>
  
  <openwebui-chat-input
    [isLoading]="isLoading()"
    [uploadedFiles]="uploadedFiles()"
    [translations]="t"
    [isRecording]="isRecording()"
    [isTranscribing]="isTranscribing()"
    [recordingError]="recordingError()"
    [transcriptionError]="transcriptionError()"
    [messageText]="inputMessage"
    (sendMessage)="sendMessage($event)"
    (stopGeneration)="stopGeneration()"
    (fileSelected)="onFileSelected($event)"
    (removeFile)="removeFile($event)"
    (startVoiceRecording)="startVoiceRecording()"
    (stopVoiceRecording)="stopVoiceRecording()"
    (retryTranscription)="retryTranscription()"
    (clearRecordingError)="clearRecordingError()"
    (clearTranscriptionError)="clearTranscriptionError()"
    (spectrogramCanvasReady)="onSpectrogramCanvasReady($event)"
  />
</div>
