<div class="context-menu" 
     [style.left.px]="position.x" 
     [style.top.px]="position.y"
     role="menu"
     [attr.aria-label]="translations?.chatActions || 'Chat actions'"
     (keydown)="onKeyDown($event)">
  @if (!isPinned) {
    <button class="menu-item" 
            (click)="emitAction('pin')" 
            type="button"
            role="menuitem"
            [attr.aria-label]="pinText">
      <svg class="menu-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M9.5 1.5L14.5 6.5L10 11L11.5 14.5L10.5 15.5L8 11.5L4.5 15L3.5 14L7 10.5L3 8L4 7L7.5 8.5L12 4L9.5 1.5Z" fill="currentColor"/>
      </svg>
      <span>{{ pinText }}</span>
    </button>
  } @else {
    <button class="menu-item" 
            (click)="emitAction('unpin')" 
            type="button"
            role="menuitem"
            [attr.aria-label]="unpinText">
      <svg class="menu-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M9.5 1.5L14.5 6.5L10 11L11.5 14.5L10.5 15.5L8 11.5L4.5 15L3.5 14L7 10.5L3 8L4 7L7.5 8.5L12 4L9.5 1.5Z" fill="currentColor" opacity="0.5"/>
      </svg>
      <span>{{ unpinText }}</span>
    </button>
  }
  
  <button class="menu-item" 
          (click)="emitAction('rename')" 
          type="button"
          role="menuitem"
          [attr.aria-label]="renameText">
    <svg class="menu-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M11.5 1.5L14.5 4.5L5 14H2V11L11.5 1.5ZM12.5 2.5L13.5 3.5L12 5L11 4L12.5 2.5Z" fill="currentColor"/>
    </svg>
    <span>{{ renameText }}</span>
  </button>
  
  <div class="menu-item-wrapper" (mouseenter)="showMoveMenu = true" (mouseleave)="showMoveMenu = false">
    <button class="menu-item" 
            (click)="toggleMoveMenu($event)" 
            type="button"
            role="menuitem"
            [attr.aria-label]="moveText"
            [attr.aria-haspopup]="true"
            [attr.aria-expanded]="showMoveMenu">
      <svg class="menu-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M14 11V14H2V11H1V14C1 14.55 1.45 15 2 15H14C14.55 15 15 14.55 15 14V11H14ZM10 7L8 9L6 7H9V1H7V7H10Z" fill="currentColor"/>
        <path d="M2 9H14V11H2V9Z" fill="currentColor"/>
      </svg>
      <span>{{ moveText }}</span>
      <svg class="chevron-right" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>

    @if (showMoveMenu && flattenedFolders.length > 0) {
      <div class="submenu" role="menu">
        @for (folder of flattenedFolders; track folder.id) {
          <button class="menu-item" 
                  (click)="emitMoveAction(folder.id)" 
                  type="button" 
                  role="menuitem"
                  [style.padding-left.px]="12 + (folder.level * 16)">
            <svg class="menu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span class="folder-name">{{ folder.name }}</span>
          </button>
        }
      </div>
    }
  </div>
  
  <button class="menu-item" 
          (click)="emitAction('export')" 
          type="button"
          role="menuitem"
          [attr.aria-label]="exportText">
    <svg class="menu-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M8 1L11 4H9V9H7V4H5L8 1ZM2 11V14H14V11H15V15H1V11H2Z" fill="currentColor"/>
    </svg>
    <span>{{ exportText }}</span>
  </button>

  <button class="menu-item" 
          (click)="emitAction('archive')" 
          type="button"
          role="menuitem"
          [attr.aria-label]="archiveText">
    <svg width="16" height="16" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="size-5"><path stroke-linecap="round" stroke-linejoin="round" d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z"></path></svg>    <span>{{ archiveText }}</span>
  </button>
  
  <button class="menu-item danger" 
          (click)="emitAction('delete')" 
          type="button"
          role="menuitem"
          [disabled]="isActive"
          [attr.aria-label]="deleteText"
          [title]="isActive ? (translations?.cannotDeleteActiveChat || 'Cannot delete active chat') : ''">
    <svg class="menu-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M5 2V1H11V2H14V3H13V14H3V3H2V2H5ZM4 3V13H12V3H4ZM6 5H7V11H6V5ZM9 5H10V11H9V5Z" fill="currentColor"/>
    </svg>
    <span>{{ deleteText }}</span>
  </button>
</div>
