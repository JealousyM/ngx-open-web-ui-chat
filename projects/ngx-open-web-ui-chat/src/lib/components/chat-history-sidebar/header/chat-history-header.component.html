<div class="chat-history-header">
  <button 
    class="new-chat-btn" 
    (click)="onNewChat()" 
    [title]="translations?.newChat || 'New Chat'"
    aria-label="Create new chat">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
    <span class="btn-label">{{ translations?.newChat || 'New Chat' }}</span>
  </button>
  
  <button 
    class="search-btn" 
    (click)="onSearch()" 
    [title]="translations?.searchChats || 'Search'"
    aria-label="Search chats">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.35-4.35"></path>
    </svg>
  </button>

  <button 
    class="archive-btn" 
    (click)="onOpenArchivedChats()" 
    [title]="translations?.archiveChat || 'Archived Chats'"
    aria-label="Archived Chats">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="size-5"><path stroke-linecap="round" stroke-linejoin="round" d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z"></path></svg>  </button>
</div>
