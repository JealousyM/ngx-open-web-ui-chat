<div class="chat-input-container">
  @if (uploadedFiles().length > 0) {
    <div class="uploaded-files-preview">
      @for (file of uploadedFiles(); track file.id) {
        <div class="file-preview">
          <span class="file-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4"><path d="M21.4383 11.6622L12.2483 20.8522C11.1225 21.9781 9.59552 22.6106 8.00334 22.6106C6.41115 22.6106 4.88418 21.9781 3.75834 20.8522C2.63249 19.7264 2 18.1994 2 16.6072C2 15.015 2.63249 13.4881 3.75834 12.3622L12.9483 3.17222C13.6989 2.42166 14.7169 2 15.7783 2C16.8398 2 17.8578 2.42166 18.6083 3.17222C19.3589 3.92279 19.7806 4.94077 19.7806 6.00222C19.7806 7.06368 19.3589 8.08166 18.6083 8.83222L9.40834 18.0222C9.03306 18.3975 8.52406 18.6083 7.99334 18.6083C7.46261 18.6083 6.95362 18.3975 6.57834 18.0222C6.20306 17.6469 5.99222 17.138 5.99222 16.6072C5.99222 16.0765 6.20306 15.5675 6.57834 15.1922L15.0683 6.71222" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
          <div class="file-info">
            <span class="file-name">{{ file.filename }}</span>
            <span class="file-size">{{ formatFileSize(file.meta?.size || 0) }}</span>
          </div>
          <button class="remove-file-btn" (click)="onRemoveFile(file.id)" type="button">×</button>
        </div>
      }
    </div>
  }
  
  <div class="chat-input">
    <div class="input-actions">
      <button class="attach-btn" (click)="toggleFileMenu()" type="button" [disabled]="isLoading()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5.5"><path d="M6 12H12M18 12H12M12 12V6M12 12V18" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      
      @if (showFileMenu()) {
        <div class="file-menu">
          <button class="menu-item" (click)="triggerFileUpload()" type="button">
            <span class="menu-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4"><path d="M21.4383 11.6622L12.2483 20.8522C11.1225 21.9781 9.59552 22.6106 8.00334 22.6106C6.41115 22.6106 4.88418 21.9781 3.75834 20.8522C2.63249 19.7264 2 18.1994 2 16.6072C2 15.015 2.63249 13.4881 3.75834 12.3622L12.9483 3.17222C13.6989 2.42166 14.7169 2 15.7783 2C16.8398 2 17.8578 2.42166 18.6083 3.17222C19.3589 3.92279 19.7806 4.94077 19.7806 6.00222C19.7806 7.06368 19.3589 8.08166 18.6083 8.83222L9.40834 18.0222C9.03306 18.3975 8.52406 18.6083 7.99334 18.6083C7.46261 18.6083 6.95362 18.3975 6.57834 18.0222C6.20306 17.6469 5.99222 17.138 5.99222 16.6072C5.99222 16.0765 6.20306 15.5675 6.57834 15.1922L15.0683 6.71222" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
            <span class="menu-text">{{ translations().uploadFiles ?? 'Upload Files' }}</span>
          </button>
        </div>
      }
      
      <input
        #fileInput
        type="file"
        (change)="onFileSelected($event)"
        style="display: none"
      />
    </div>
    
    <input
      type="text"
      [(ngModel)]="inputMessage"
      (keyup.enter)="onKeyEnter()"
      [disabled]="isLoading()"
      [placeholder]="translations().placeholder"
      class="message-input"
    />
    
    @if (isLoading()) {
      <button (click)="onStopGeneration()" class="stop-button">
        {{ translations().stop }}
      </button>
    } @else {
      <button (click)="onSendMessage()" [disabled]="!inputMessage().trim()" class="send-button">
        {{ translations().send }}
      </button>
    }
  </div>
</div>
